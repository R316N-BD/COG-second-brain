name: Physique checks
on:
  push:
    paths:
      - 'cog_core/physique*.py'
      - 'tests/test_physique*.py'
      - 'requirements-physique.txt'
      - '.github/workflows/physique-checks.yml'
  pull_request:
    paths:
      - 'cog_core/physique*.py'
      - 'tests/test_physique*.py'
      - 'requirements-physique.txt'
      - '.github/workflows/physique-checks.yml'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-physique.txt
      - run: python -m compileall -q cog_core
      - run: python -m unittest discover -s tests -p 'test_physique*.py' -v
