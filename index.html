views.genui=()=>`<div class="grid split">${card('Generative UI builder',`<div class="formrow"><select id="uikind"><option value="bar">Bar chart</option><option value="table">Table</option><option value="metrics">Metrics</option><option value="checklist">Checklist</option></select>${btn('Render sample','renderui','primary')}</div><div id="genoutput">${genOutput()}</div>`)}${card('Schema and safety',`<pre id="schema">${esc(JSON.stringify(genSchema(),null,2))}</pre>${btn('Export sample JSON','exportui')}${info('Only known component types. No generated HTML, scripts, shell or network actions.')}`)}</div>`;function genSchema(){let type=state.gen;return {version:1,type,title:'Sample mission summary',...(type==='table'?{columns:['State','Count'],rows:[['Done',12],['Open',5]]}:{rows:[{label:'Done',value:type==='checklist'?true:12},{label:'Open',value:type==='checklist'?false:5}]})}}function genOutput(){return state.gen==='bar'?chart(['Done','Open'],[12,5]):state.gen==='table'?table(['State','Count'],[['Done','12'],['Open','5']]):state.gen==='metrics'?`<div class="grid two">${stat('Done','12','Sample')}${stat('Open','5','Sample','purple')}</div>`:'<label class="check"><input type="checkbox" checked>Done</label><label class="check"><input type="checkbox">Open</label>'}wire.genui=()=>{$('uikind').value=state.gen;bind('renderui',()=>{state.gen=$('uikind').value;render()});bind('exportui',()=>download('cog-ui-demo.json',JSON.stringify(genSchema(),null,2)))};

views.trading=()=>`<div class="grid split">${card('Historical research',`<div class="grid two">${stat('Dataset','DEMO','Synthetic closes')}${stat('Execution','OFF','No orders','amber')}</div><div class="spacer"></div><div class="formrow"><label>Fast average <input id="fast" type="number" min="2" max="10" value="3" style="width:70px"></label><label>Slow average <input id="slow" type="number" min="3" max="15" value="7" style="width:70px"></label>${btn('Run demo backtest','backtest','primary')}</div>${chart(['1','2','3','4','5','6','7','8'],[100,103,101,108,105,112,109,114])}<pre id="btresult">Synthetic price series only. Set moving average windows and run.</pre>`)}${card('Research sandbox',`${entry('Kalshi / Polymarket','Future read-only feeds',pill('Not connected','purple'),'↗')}${entry('Historical testing','Offline CSV workflow',pill('Simulation','blue'),'▤')}${entry('Real money','No order adapter',pill('Disabled','amber'),'⛨')}${info('Results are synthetic, not evidence of a profitable strategy. Fees and slippage are not modeled in this visual demo.')}`)}</div>`;wire.trading=()=>bind('backtest',()=>{const f=+$('fast').value,s=+$('slow').value;if(!Number.isInteger(f)||!Number.isInteger(s)||f<2||s>15||f>=s){$('btresult').textContent='Use integer windows: 2 ≤ fast < slow ≤ 15.';return}const p=[100,103,101,108,105,112,109,114,110,115,113,117,116,121,118,120,116,119,122,123];let capital=100,position=false,trades=0;const avg=(i,n)=>p.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n;for(let i=s-1;i<p.length-1;i++){let next=avg(i,f)>avg(i,s);if(next!==position)trades++;position=next;if(position)capital*=p[i+1]/p[i]}$('btresult').textContent=JSON.stringify({data:'synthetic',fast:f,slow:s,position_changes:trades,gross_return_pct:+(capital-100).toFixed(2),costs:'not modeled',orders:0},null,2)});
